name: Android APK Build
on:
  workflow_dispatch:  # 启用手动触发按钮
  push:
    branches: [ main, master ] # 推送代码时自动触发

jobs:
  build:
    runs-on: ubuntu-latest # 使用Ubuntu环境
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 设置Gradle权限
        run: chmod +x gradlew

      - name: 编译Debug APK
        run: ./gradlew assembleDebug

      - name: 上传APK包
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk # APK生成路径[reference:4]
