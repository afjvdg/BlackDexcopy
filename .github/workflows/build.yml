name: Android APK Build
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5  # 从 v4 升级到 v5，支持 Node.js 24

      - name: 设置JDK 17
        uses: actions/setup-java@v5  # 从 v4 升级到 v5，支持 Node.js 24
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 设置Gradle权限
        run: chmod +x gradlew

      - name: 编译Debug APK
        run: ./gradlew assembleDebug

      - name: 上传APK包
        uses: actions/upload-artifact@v4  # 此Action暂未推出v5版，保留v4即可
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
